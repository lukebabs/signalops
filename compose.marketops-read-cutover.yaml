# Read-only gateway cutover. The referenced file is root-owned and contains
# the dedicated database URLs; it is intentionally not committed.
services:
  gateway:
    env_file:
      - /etc/signalops/marketops-cutover.env
    environment:
      # Subscriber lists and their subject-owned context are MarketOps data.
      # The root-owned cutover environment injects this dedicated credential.
      SIGNALOPS_SUBSCRIBER_GATEWAY_DATABASE_URL: postgres://signalops_subscriber_gateway_runtime:${SIGNALOPS_SUBSCRIBER_GATEWAY_PASSWORD:?inject dedicated MarketOps subscriber gateway secret}@marketops-postgres:5432/marketops?sslmode=disable
