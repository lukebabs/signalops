apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signalops-staging-route
  namespace: signalops-app
  labels:
    app.kubernetes.io/name: signalops-staging-route
    app.kubernetes.io/component: mesh-route
    signalops.syncratic.io/plane: app
spec:
  hostnames:
    - signalops-staging.syncratic.co
  parentRefs:
    - name: public-ingress
      namespace: istio-system
      sectionName: http
    - name: public-ingress
      namespace: istio-system
      sectionName: signalops-staging-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /healthz
        - path:
            type: PathPrefix
            value: /readyz
      backendRefs:
        - name: signalops-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: signalops-web
          port: 8080
