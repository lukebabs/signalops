apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: signalops-staging-selfsigned-bootstrap
  namespace: signalops-app
  labels:
    app.kubernetes.io/name: signalops-staging-tls
    app.kubernetes.io/component: mesh-route
    signalops.syncratic.io/plane: app
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: signalops-staging-tls
  namespace: signalops-app
  labels:
    app.kubernetes.io/name: signalops-staging-tls
    app.kubernetes.io/component: mesh-route
    signalops.syncratic.io/plane: app
spec:
  secretName: signalops-staging-tls
  commonName: signalops-staging.syncratic.co
  dnsNames:
    - signalops-staging.syncratic.co
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: signalops-staging-selfsigned-bootstrap
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-istio-public-ingress-signalops-staging-tls
  namespace: signalops-app
  labels:
    app.kubernetes.io/name: signalops-staging-tls
    app.kubernetes.io/component: mesh-route
    signalops.syncratic.io/plane: app
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: istio-system
  to:
    - group: ""
      kind: Secret
      name: signalops-staging-tls
