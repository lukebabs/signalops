apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-marketops-jobs-openbao-egress
  namespace: signalops-marketops
  labels:
    app.kubernetes.io/name: signalops-marketops-k8s-job-runner
    signalops.syncratic.io/stage: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: signalops-marketops-k8s-job-runner
      app.kubernetes.io/part-of: signalops
      signalops.syncratic.io/stage: staging
      signalops.syncratic.io/production-cutover-allowed: "false"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
