apiVersion: v1
kind: Service
metadata:
  name: signalops-redpanda-staging
  namespace: signalops-data
  labels:
    app.kubernetes.io/name: signalops-redpanda-staging
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: signalops
    signalops.syncratic.io/plane: data
    signalops.syncratic.io/purpose: signal-connect-k8s-staging
    signalops.syncratic.io/stage: staging
    signalops.syncratic.io/production-cutover-allowed: "false"
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
  selector:
    app.kubernetes.io/name: signalops-redpanda-staging
    app.kubernetes.io/component: broker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalops-redpanda-staging
  namespace: signalops-data
  labels:
    app.kubernetes.io/name: signalops-redpanda-staging
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: signalops
    signalops.syncratic.io/plane: data
    signalops.syncratic.io/purpose: signal-connect-k8s-staging
    signalops.syncratic.io/stage: staging
    signalops.syncratic.io/production-cutover-allowed: "false"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: signalops-redpanda-staging
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signalops-redpanda-staging
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: signalops
        signalops.syncratic.io/plane: data
        signalops.syncratic.io/purpose: signal-connect-k8s-staging
        signalops.syncratic.io/stage: staging
        signalops.syncratic.io/production-cutover-allowed: "false"
    spec:
      serviceAccountName: signalops-broker-access
      terminationGracePeriodSeconds: 30
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v25.3.1
          imagePullPolicy: IfNotPresent
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://signalops-redpanda-staging.signalops-data.svc.cluster.local:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=signalops-redpanda-staging.signalops-data.svc.cluster.local:33145
            - --pandaproxy-addr=internal://0.0.0.0:8082
            - --schema-registry-addr=internal://0.0.0.0:8081
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - rpk cluster health >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
      volumes:
        - name: redpanda-data
          emptyDir: {}
