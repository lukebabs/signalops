apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway-deployment.yaml
  - gateway-service.yaml
  - gateway-allow-runtime-smoke-postgres-egress.yaml
  - runtime-smoke-postgres-allow-signalops-gateway-ingress.yaml
  - gateway-allow-web-proxy-ingress.yaml
  - web-deployment.yaml
  - web-nginx-config.yaml
  - web-service.yaml
  - web-allow-gateway-proxy-egress.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: signalops
      signalops.syncratic.io/stage: staging
      signalops.syncratic.io/production-cutover-allowed: "false"
