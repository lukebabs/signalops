apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-gateway-proxy-egress
  namespace: signalops-app
  labels:
    app.kubernetes.io/name: signalops-web
    signalops.syncratic.io/stage: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: signalops-web
      app.kubernetes.io/part-of: signalops
      signalops.syncratic.io/stage: staging
      signalops.syncratic.io/production-cutover-allowed: "false"
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: signalops-gateway
              app.kubernetes.io/part-of: signalops
              signalops.syncratic.io/stage: staging
              signalops.syncratic.io/production-cutover-allowed: "false"
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
