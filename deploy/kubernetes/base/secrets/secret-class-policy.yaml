apiVersion: v1
kind: ConfigMap
metadata:
  name: signalops-secret-class-policy
  namespace: signalops-app
  labels:
    app.kubernetes.io/part-of: signalops
    signalops.syncratic.io/policy-type: secret-classification
data:
  status: planning-only-not-a-secret-store
  rule: Kubernetes workloads must consume per-plane secret classes. Do not reproduce the broad Compose .env model.
  app-plane: oidc public client settings, gateway DB pool credentials, Stripe restricted keys, Syncratic API credentials, notification encryption key.
  connect-plane: connector credentials, webhook signing secrets, broker producer credentials, ingress idempotency keys.
  marketops-plane: provider API credentials, MarketOps database roles, Syncratic worker credentials, scheduler identity.
  cyberops-plane: CyberOps database/broker roles and detector-specific credentials only.
  identity-plane: Keycloak database/admin/bootstrap credentials and SMS/email-provider credentials.
  data-plane: database admin/bootstrap credentials, PgBouncer users, broker credentials, backup/restore credentials.
  observability-plane: scrape credentials, dashboard admin credentials, alert routing secrets.
  next-gate: Replace this policy ConfigMap with ExternalSecret or SealedSecret manifests after selecting the production secret backend.
