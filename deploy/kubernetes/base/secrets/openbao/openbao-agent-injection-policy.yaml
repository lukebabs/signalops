apiVersion: v1
kind: ConfigMap
metadata:
  name: signalops-openbao-agent-injection-policy
  namespace: signalops-app
  labels:
    app.kubernetes.io/part-of: signalops
    signalops.syncratic.io/secret-backend: openbao
    signalops.syncratic.io/policy-type: secret-injection
data:
  status: planning-only-not-a-secret
  backend: OpenBao Agent Injector
  cluster-evidence: OpenBao namespace and openbao-agent-injector-svc exist; External Secrets Operator CRDs are not installed.
  injection-model: Workloads receive secrets through OpenBao Agent Injector annotations and per-plane Kubernetes auth roles.
  required-annotations: |
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "signalops-<plane>"
    vault.hashicorp.com/agent-inject-secret-<file>: "signalops/data/k8s/<plane>/<secret-name>"
    vault.hashicorp.com/agent-inject-template-<file>: |
      {{- with secret "signalops/data/k8s/<plane>/<secret-name>" -}}
      export KEY="{{ .Data.data.KEY }}"
      {{- end }}
  guardrails: |
    Do not commit rendered secret files.
    Do not mount one broad platform secret into all pods.
    Use one OpenBao Kubernetes auth role per SignalOps plane, with read access limited to signalops/data/k8s/<plane>/*.
    Prefer file injection plus explicit env loading inside entrypoints over broad envFrom secrets for high-risk credentials.
    Database credentials should remain per workload role, not shared per namespace.
