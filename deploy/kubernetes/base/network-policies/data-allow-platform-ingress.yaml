apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-planes-to-data-boundaries
  namespace: signalops-data
  labels:
    app.kubernetes.io/part-of: signalops
    signalops.syncratic.io/plane: data
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - pgbouncer
          - database
          - broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - signalops-app
                  - signalops-connect
                  - signalops-marketops
                  - signalops-cyberops
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6432
        - protocol: TCP
          port: 9092
