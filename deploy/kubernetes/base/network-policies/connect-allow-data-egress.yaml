apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-connect-data-egress
  namespace: signalops-connect
  labels:
    app.kubernetes.io/part-of: signalops
    signalops.syncratic.io/plane: connect
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: signalops-data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6432
        - protocol: TCP
          port: 9092
