apiVersion: batch/v1
kind: CronJob
metadata:
  name: marketops-global-dashboard-projection
  namespace: signalops-marketops
  labels:
    app.kubernetes.io/name: signalops-marketops-k8s-job-runner
    app.kubernetes.io/component: projection-worker
    signalops.syncratic.io/plane: marketops
    signalops.syncratic.io/job-id: marketops-global-dashboard-projection
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: signalops-marketops-k8s-job-runner
            app.kubernetes.io/component: projection-worker
            signalops.syncratic.io/plane: marketops
            signalops.syncratic.io/stage: production
            signalops.syncratic.io/production-cutover-allowed: "true"
            signalops.syncratic.io/job-id: marketops-global-dashboard-projection
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/role: "signalops-marketops"
            vault.hashicorp.com/service: "https://openbao.openbao.svc:8200"
            vault.hashicorp.com/tls-secret: "signalops-openbao-ca"
            vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"
            vault.hashicorp.com/agent-inject-secret-marketops-worker-runtime.env: "signalops/data/k8s/marketops/marketops-worker-runtime-production"
            vault.hashicorp.com/agent-inject-template-marketops-worker-runtime.env: |
              {{- with secret "signalops/data/k8s/marketops/marketops-worker-runtime-production" -}}
              export SIGNALOPS_DATABASE_URL='{{ .Data.data.SIGNALOPS_MARKETOPS_DATABASE_URL }}'
              export SIGNALOPS_TEMPORAL_DATABASE_URL='{{ .Data.data.SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL }}'
              export SIGNALOPS_MARKETOPS_DATABASE_URL='{{ .Data.data.SIGNALOPS_MARKETOPS_DATABASE_URL }}'
              export SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL='{{ .Data.data.SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL }}'
              export SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL='{{ .Data.data.SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL }}'
              export SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_TEMPORAL_DATABASE_URL='{{ .Data.data.SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_TEMPORAL_DATABASE_URL }}'
              {{- end }}
        spec:
          serviceAccountName: signalops-marketops-provider-worker
          restartPolicy: Never
          imagePullSecrets:
            - name: signalops-ghcr-pull
          containers:
            - name: marketops-job
              image: ghcr.io/syncratic-inc/signalops-marketops-k8s-job-runner
              imagePullPolicy: IfNotPresent
              args:
                - marketops-global-dashboard-projection
              env:
                - name: SIGNALOPS_ENV
                  value: kubernetes-production
                - name: SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED
                  value: "true"
                - name: MARKETOPS_K8S_DRY_RUN
                  value: "false"
                - name: MARKETOPS_POSTCLOSE_ACKNOWLEDGE_WRITES
                  value: "true"
