apiVersion: v1
kind: Service
metadata:
  name: signalops-postgres-production
  namespace: signalops-data
  labels:
    app.kubernetes.io/name: signalops-postgres-production
    app.kubernetes.io/component: database
    signalops.syncratic.io/plane: data
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: signalops-postgres-production
    app.kubernetes.io/component: database
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: signalops-postgres-production
  namespace: signalops-data
  labels:
    app.kubernetes.io/name: signalops-postgres-production
    app.kubernetes.io/component: database
    signalops.syncratic.io/plane: data
spec:
  serviceName: signalops-postgres-production
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signalops-postgres-production
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signalops-postgres-production
        app.kubernetes.io/component: database
        signalops.syncratic.io/plane: data
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: signalops-ghcr-pull
      containers:
        - name: postgres
          image: ghcr.io/syncratic-inc/signalops-postgres-pgbackrest:production
          imagePullPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: signalops
            - name: POSTGRES_DB
              value: signalops
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signalops-postgres-production-auth
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "signalops", "-d", "signalops"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: syncratic-data-retain
        resources:
          requests:
            storage: 160Gi
---
