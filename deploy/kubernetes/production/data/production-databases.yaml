apiVersion: v1
kind: Service
metadata:
  name: signalops-postgres-production
  namespace: signalops-data
  labels:
    app.kubernetes.io/name: signalops-postgres-production
    app.kubernetes.io/component: database
    signalops.syncratic.io/plane: data
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: signalops-postgres-production
    app.kubernetes.io/component: database
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: signalops-postgres-production
  namespace: signalops-data
  labels:
    app.kubernetes.io/name: signalops-postgres-production
    app.kubernetes.io/component: database
    signalops.syncratic.io/plane: data
spec:
  serviceName: signalops-postgres-production
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signalops-postgres-production
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signalops-postgres-production
        app.kubernetes.io/component: database
        signalops.syncratic.io/plane: data
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "signalops-data"
        vault.hashicorp.com/service: "https://openbao.openbao.svc:8200"
        vault.hashicorp.com/tls-secret: "signalops-openbao-ca"
        vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"
        vault.hashicorp.com/agent-inject-secret-signalops-data-runtime.env: "signalops/data/k8s/data/signalops-databases-runtime-production"
        vault.hashicorp.com/agent-inject-template-signalops-data-runtime.env: |
          {{- with secret "signalops/data/k8s/data/signalops-databases-runtime-production" -}}
          export SIGNALOPS_POSTGRES_PASSWORD="{{ .Data.data.SIGNALOPS_POSTGRES_PASSWORD }}"
          export SIGNALOPS_TIMESCALE_PASSWORD="{{ .Data.data.SIGNALOPS_TIMESCALE_PASSWORD }}"
          export SIGNALOPS_MARKETOPS_POSTGRES_PASSWORD="{{ .Data.data.SIGNALOPS_MARKETOPS_POSTGRES_PASSWORD }}"
          export SIGNALOPS_MARKETOPS_TEMPORAL_PASSWORD="{{ .Data.data.SIGNALOPS_MARKETOPS_TEMPORAL_PASSWORD }}"
          {{- end }}
    spec:
      serviceAccountName: signalops-data-secret-reader
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: signalops-ghcr-pull
      containers:
        - name: postgres
          image: ghcr.io/syncratic-inc/signalops-postgres-pgbackrest:production
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test -s /vault/secrets/signalops-data-runtime.env
              . /vault/secrets/signalops-data-runtime.env
              export POSTGRES_PASSWORD="${SIGNALOPS_POSTGRES_PASSWORD}"
              exec docker-entrypoint.sh postgres
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: signalops
            - name: POSTGRES_DB
              value: signalops
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "signalops", "-d", "signalops"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: syncratic-data-retain
        resources:
          requests:
            storage: 160Gi
---
