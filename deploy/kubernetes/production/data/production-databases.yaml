apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-signalops-production-database-ingress
  namespace: signalops-data
  labels:
    app.kubernetes.io/name: signalops-production-databases
    signalops.syncratic.io/plane: data
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - signalops-postgres-production
          - signalops-timescaledb-production
          - marketops-postgres-production
          - marketops-timescaledb-production
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: signalops-app
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: signalops
              signalops.syncratic.io/stage: production
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: signalops-marketops
      ports:
        - protocol: TCP
          port: 5432
