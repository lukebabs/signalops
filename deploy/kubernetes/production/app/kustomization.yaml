apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway-deployment.yaml
  - gateway-service.yaml
  - gateway-network-policy.yaml
  - web-deployment.yaml
  - web-nginx-config.yaml
  - web-service.yaml
  - web-network-policy.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: signalops
      signalops.syncratic.io/stage: production
      signalops.syncratic.io/production-cutover-allowed: "true"
