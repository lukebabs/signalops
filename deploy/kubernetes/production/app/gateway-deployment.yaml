apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalops-gateway-production
  namespace: signalops-app
  labels:
    app.kubernetes.io/name: signalops-gateway
    app.kubernetes.io/component: gateway
    signalops.syncratic.io/plane: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: signalops-gateway
      app.kubernetes.io/part-of: signalops
      signalops.syncratic.io/stage: production
      signalops.syncratic.io/production-cutover-allowed: "true"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signalops-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: signalops
        signalops.syncratic.io/plane: app
        signalops.syncratic.io/stage: production
        signalops.syncratic.io/production-cutover-allowed: "true"
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "signalops-app"
        vault.hashicorp.com/service: "https://openbao.openbao.svc:8200"
        vault.hashicorp.com/tls-secret: "signalops-openbao-ca"
        vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"
        vault.hashicorp.com/agent-inject-secret-signalops-gateway-runtime.env: "signalops/data/k8s/app/signalops-gateway-runtime-production"
        vault.hashicorp.com/agent-inject-template-signalops-gateway-runtime.env: |
          {{- with secret "signalops/data/k8s/app/signalops-gateway-runtime-production" -}}
          export SIGNALOPS_DATABASE_URL="{{ .Data.data.SIGNALOPS_DATABASE_URL }}"
          export SIGNALOPS_TEMPORAL_DATABASE_URL="{{ .Data.data.SIGNALOPS_TEMPORAL_DATABASE_URL }}"
          export SIGNALOPS_MARKETOPS_DATABASE_URL="{{ .Data.data.SIGNALOPS_MARKETOPS_DATABASE_URL }}"
          export SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL="{{ .Data.data.SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL }}"
          export SIGNALOPS_SUBSCRIBER_GATEWAY_DATABASE_URL="{{ .Data.data.SIGNALOPS_SUBSCRIBER_GATEWAY_DATABASE_URL }}"
          export SIGNALOPS_SUBSCRIBER_LISTS_ENABLED="{{ .Data.data.SIGNALOPS_SUBSCRIBER_LISTS_ENABLED }}"
          export SIGNALOPS_SUBSCRIBER_LISTS_PILOT_TENANTS="{{ .Data.data.SIGNALOPS_SUBSCRIBER_LISTS_PILOT_TENANTS }}"
          export SIGNALOPS_SUBSCRIBER_B2C_TENANT_ID="{{ .Data.data.SIGNALOPS_SUBSCRIBER_B2C_TENANT_ID }}"
          export SIGNALOPS_SUBSCRIBER_B2C_AUTO_ACTIVATE_EXPLORER="{{ .Data.data.SIGNALOPS_SUBSCRIBER_B2C_AUTO_ACTIVATE_EXPLORER }}"
          export SIGNALOPS_SUBSCRIBER_B2C_REQUIRE_SUBSCRIPTION="{{ .Data.data.SIGNALOPS_SUBSCRIBER_B2C_REQUIRE_SUBSCRIPTION }}"
          export SIGNALOPS_SUBSCRIPTIONS_ENABLED="{{ .Data.data.SIGNALOPS_SUBSCRIPTIONS_ENABLED }}"
          export SIGNALOPS_NOTIFICATION_ENCRYPTION_KEY="{{ .Data.data.SIGNALOPS_NOTIFICATION_ENCRYPTION_KEY }}"
          export STRIPE_RESTRICTED_API_KEY="{{ .Data.data.STRIPE_RESTRICTED_API_KEY }}"
          export STRIPE_WEBHOOK_SECRET="{{ .Data.data.STRIPE_WEBHOOK_SECRET }}"
          export STRIPE_API_KEY="{{ .Data.data.STRIPE_API_KEY }}"
          export SIGNALOPS_STRIPE_CHECKOUT_SUCCESS_URL="{{ .Data.data.SIGNALOPS_STRIPE_CHECKOUT_SUCCESS_URL }}"
          export SIGNALOPS_STRIPE_CHECKOUT_CANCEL_URL="{{ .Data.data.SIGNALOPS_STRIPE_CHECKOUT_CANCEL_URL }}"
          export SIGNALOPS_STRIPE_PORTAL_RETURN_URL="{{ .Data.data.SIGNALOPS_STRIPE_PORTAL_RETURN_URL }}"
          export SYNCRATIC_API_BASE_URL="{{ .Data.data.SYNCRATIC_API_BASE_URL }}"
          export SYNCRATIC_AUTH_MODE="{{ .Data.data.SYNCRATIC_AUTH_MODE }}"
          export SYNCRATIC_TOKEN_URL="{{ .Data.data.SYNCRATIC_TOKEN_URL }}"
          export SYNCRATIC_TOKEN_GRANT="{{ .Data.data.SYNCRATIC_TOKEN_GRANT }}"
          export SYNCRATIC_CLIENT_ID="{{ .Data.data.SYNCRATIC_CLIENT_ID }}"
          export SYNCRATIC_CLIENT_SECRET="{{ .Data.data.SYNCRATIC_CLIENT_SECRET }}"
          export SYNCRATIC_USERNAME="{{ .Data.data.SYNCRATIC_USERNAME }}"
          export SYNCRATIC_PASSWORD="{{ .Data.data.SYNCRATIC_PASSWORD }}"
          export SYNCRATIC_TOKEN_AUDIENCE="{{ .Data.data.SYNCRATIC_TOKEN_AUDIENCE }}"
          {{- end }}
    spec:
      serviceAccountName: signalops-gateway
      imagePullSecrets:
        - name: signalops-ghcr-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: ghcr.io/syncratic-inc/signalops-gateway:production
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test -s /vault/secrets/signalops-gateway-runtime.env
              . /vault/secrets/signalops-gateway-runtime.env
              # Ask is paused while deterministic/stored narratives remain available.
              unset SYNCRATIC_API_BASE_URL
              if [ -S /run/signalops/deployment-agent.sock ]; then
                export SIGNALOPS_SCHEDULE_RUNNER_SOCKET=/run/signalops/deployment-agent.sock
              fi
              exec signalops-gateway
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SIGNALOPS_HTTP_ADDR
              value: ":8080"
            - name: SIGNALOPS_ENV
              value: "k8s-production"
            - name: SIGNALOPS_AUTH_ENABLED
              value: "true"
            - name: SIGNALOPS_AUTH_ISSUER
              value: "https://auth.syncratic.co/realms/syncratic"
            - name: SIGNALOPS_AUTH_REALM
              value: "syncratic"
            - name: SIGNALOPS_AUTH_JWKS_URL
              value: "https://auth.syncratic.co/realms/syncratic/protocol/openid-connect/certs"
            - name: SIGNALOPS_AUTH_AUDIENCE
              value: "signalops-api"
            - name: SIGNALOPS_AUTH_CLIENT_ID
              value: "signalops-web"
            - name: SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED
              value: "true"
            - name: SIGNALOPS_SUBSCRIBER_LISTS_ENABLED
              value: "true"
            - name: SIGNALOPS_SUBSCRIPTIONS_ENABLED
              value: "true"
            - name: SIGNALOPS_SUBSCRIBER_B2C_TENANT_ID
              value: "tenant-local"
            - name: SIGNALOPS_SUBSCRIBER_B2C_REQUIRE_SUBSCRIPTION
              value: "true"
            - name: SIGNALOPS_DATABASE_MAX_OPEN_CONNS
              value: "20"
            - name: SIGNALOPS_DATABASE_MAX_IDLE_CONNS
              value: "5"
            - name: SIGNALOPS_MARKETOPS_DATABASE_MAX_OPEN_CONNS
              value: "20"
            - name: SIGNALOPS_MARKETOPS_DATABASE_MAX_IDLE_CONNS
              value: "5"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - python3 -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/readyz', timeout=2).read()"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - python3 -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: signalops-deployment-agent-socket
              mountPath: /run/signalops
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 1Gi
      volumes:
        - name: signalops-deployment-agent-socket
          hostPath:
            path: /run/signalops
            type: DirectoryOrCreate
