apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalops-web-production
  namespace: signalops-app
  labels:
    app.kubernetes.io/name: signalops-web
    app.kubernetes.io/component: web
    signalops.syncratic.io/plane: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: signalops-web
      app.kubernetes.io/part-of: signalops
      signalops.syncratic.io/stage: production
      signalops.syncratic.io/production-cutover-allowed: "true"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signalops-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: signalops
        signalops.syncratic.io/plane: app
        signalops.syncratic.io/stage: production
        signalops.syncratic.io/production-cutover-allowed: "true"
    spec:
      serviceAccountName: signalops-web
      imagePullSecrets:
        - name: signalops-ghcr-pull
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: ghcr.io/syncratic-inc/signalops-web:production
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - wget -qO- --timeout=2 http://127.0.0.1:8080/ >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - wget -qO- --timeout=2 http://127.0.0.1:8080/ >/dev/null
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: web-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: web-nginx-config
          configMap:
            name: signalops-web-nginx-production
