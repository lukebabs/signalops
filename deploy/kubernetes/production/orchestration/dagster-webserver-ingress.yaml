apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-signalops-admin-dagster-readonly
  namespace: signalops-orchestration
  labels:
    app.kubernetes.io/name: signalops-dagster-webserver
    signalops.syncratic.io/stage: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: signalops-dagster
      app.kubernetes.io/name: dagster
      component: dagster-webserver-read-only
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: signalops-app
          podSelector:
            matchLabels:
              app.kubernetes.io/name: signalops-gateway
              app.kubernetes.io/part-of: signalops
              signalops.syncratic.io/stage: production
      ports:
        - protocol: TCP
          port: 80
