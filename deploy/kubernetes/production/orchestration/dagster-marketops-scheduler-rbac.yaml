apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dagster-marketops-scheduler
  namespace: signalops-marketops
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dagster-marketops-scheduler
  namespace: signalops-marketops
subjects:
  - kind: ServiceAccount
    name: signalops-dagster-dagster-user-deployments-user-deployments
    namespace: signalops-orchestration
roleRef:
  kind: Role
  name: dagster-marketops-scheduler
  apiGroup: rbac.authorization.k8s.io
