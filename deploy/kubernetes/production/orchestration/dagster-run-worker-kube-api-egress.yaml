apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dagster-run-worker-kube-api-egress
  namespace: signalops-orchestration
  labels:
    app.kubernetes.io/name: signalops-dagster-run-worker
    signalops.syncratic.io/stage: production
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dagster
      app.kubernetes.io/instance: dagster
      app.kubernetes.io/component: run_worker
      dagster/code-location: signalops-dagster-definitions
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toCIDR:
        - 10.43.0.1/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - 192.168.2.5/32
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
