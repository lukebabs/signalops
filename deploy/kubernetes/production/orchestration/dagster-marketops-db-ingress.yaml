apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dagster-shadow-marketops-read
  namespace: signalops-data
  labels:
    app.kubernetes.io/name: signalops-dagster-definitions
    app.kubernetes.io/part-of: signalops
    signalops.syncratic.io/stage: shadow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: marketops-postgres-production
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: signalops-orchestration
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dagster-user-deployments
              app.kubernetes.io/instance: signalops-dagster
              component: user-deployments
              deployment: signalops-dagster-definitions
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: signalops-orchestration
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dagster
              app.kubernetes.io/instance: dagster
              app.kubernetes.io/component: run_worker
              dagster/code-location: signalops-dagster-definitions
      ports:
        - protocol: TCP
          port: 5432
