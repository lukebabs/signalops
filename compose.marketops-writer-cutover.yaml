# Writer cutover is a separate, post-read-validation phase. It adds dedicated
# URLs to the continuous MarketOps writers; shared application writers retain their
# existing configuration. Scheduler activation is separately controlled.
services:
  normalizer:
    environment:
      SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED: ${SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED:-true}
      SIGNALOPS_MARKETOPS_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-postgres://signalops:${SIGNALOPS_MARKETOPS_POSTGRES_PASSWORD:?set an injected MarketOps database secret}@marketops-postgres:5432/marketops?sslmode=disable}
      SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL: ${SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL:-postgres://signalops:${SIGNALOPS_MARKETOPS_TEMPORAL_PASSWORD:?set an injected MarketOps temporal database secret}@marketops-timescaledb:5432/marketops_temporal?sslmode=disable}
  signal-persister:
    environment:
      SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED: ${SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED:-true}
      SIGNALOPS_MARKETOPS_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-postgres://signalops:${SIGNALOPS_MARKETOPS_POSTGRES_PASSWORD:?set an injected MarketOps database secret}@marketops-postgres:5432/marketops?sslmode=disable}
      SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL: ${SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL:-postgres://signalops:${SIGNALOPS_MARKETOPS_TEMPORAL_PASSWORD:?set an injected MarketOps temporal database secret}@marketops-timescaledb:5432/marketops_temporal?sslmode=disable}
  marketops-signal-assurance-registrar:
    environment:
      SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED: ${SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED:-true}
      SIGNALOPS_MARKETOPS_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-postgres://signalops:${SIGNALOPS_MARKETOPS_POSTGRES_PASSWORD:?set an injected MarketOps database secret}@marketops-postgres:5432/marketops?sslmode=disable}
      SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL: ${SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL:-postgres://signalops:${SIGNALOPS_MARKETOPS_TEMPORAL_PASSWORD:?set an injected MarketOps temporal database secret}@marketops-timescaledb:5432/marketops_temporal?sslmode=disable}
  marketops-signal-assurance-outbox:
    environment:
      SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED: ${SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED:-true}
      SIGNALOPS_MARKETOPS_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-postgres://signalops:${SIGNALOPS_MARKETOPS_POSTGRES_PASSWORD:?set an injected MarketOps database secret}@marketops-postgres:5432/marketops?sslmode=disable}
      SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL: ${SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL:-postgres://signalops:${SIGNALOPS_MARKETOPS_TEMPORAL_PASSWORD:?set an injected MarketOps temporal database secret}@marketops-timescaledb:5432/marketops_temporal?sslmode=disable}
  marketops-signal-assurance-worker:
    environment:
      SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED: ${SIGNALOPS_MARKETOPS_DATA_BOUNDARY_REQUIRED:-true}
      SIGNALOPS_MARKETOPS_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-postgres://signalops:${SIGNALOPS_MARKETOPS_POSTGRES_PASSWORD:?set an injected MarketOps database secret}@marketops-postgres:5432/marketops?sslmode=disable}
      SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL: ${SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL:-postgres://signalops:${SIGNALOPS_MARKETOPS_TEMPORAL_PASSWORD:?set an injected MarketOps temporal database secret}@marketops-timescaledb:5432/marketops_temporal?sslmode=disable}


  subscriber-global-marketops-parity-manifest:
    profiles: ["subscriber-global-evidence"]
    build:
      context: .
      target: subscriber-global-marketops-parity-manifest
    environment:
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-}

  subscriber-global-marketops-evidence-materializer:
    profiles: ["subscriber-global-evidence"]
    build:
      context: .
      target: subscriber-global-marketops-evidence-materializer
    environment:
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-}
  subscriber-global-eod-history-materializer:
    profiles: ["subscriber-global-evidence"]
    build:
      context: .
      target: subscriber-global-eod-history-materializer
    environment:
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-}
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_TEMPORAL_DATABASE_URL: ${SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL:-}
  subscriber-global-saf-benchmark-materializer:
    profiles: ["subscriber-global-evidence"]
    build:
      context: .
      target: subscriber-global-saf-benchmark-materializer
    environment:
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-}
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_TEMPORAL_DATABASE_URL: ${SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL:-}
  subscriber-global-annual-financial-refresh:
    profiles: ["subscriber-global-evidence"]
    build:
      context: .
      target: subscriber-global-annual-financial-refresh
    environment:
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-}
      SIGNALOPS_FMP_BASE_URL: ${SIGNALOPS_FMP_BASE_URL:-}
      SIGNALOPS_FMP_API_KEY: ${SIGNALOPS_FMP_API_KEY:-${fmp_apikey:-}}
  subscriber-global-annual-valuation-materializer:
    profiles: ["subscriber-global-evidence"]
    build:
      context: .
      target: subscriber-global-annual-valuation-materializer
    environment:
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:-}
