# Dedicated URLs for MarketOps batch runners. This file is intentionally not
# loaded by default and must be used only by the root-owned scheduler launcher.
x-marketops-scheduled-boundary: &marketops-scheduled-boundary
  SIGNALOPS_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:?inject dedicated MarketOps primary URL}
  SIGNALOPS_TEMPORAL_DATABASE_URL: ${SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL:?inject dedicated MarketOps temporal URL}

services:
  marketops-intraday-monitor:
    environment: *marketops-scheduled-boundary
  marketops-valuation-runner:
    environment: *marketops-scheduled-boundary
  marketops-tactical-valuation-runner:
    environment: *marketops-scheduled-boundary
  marketops-eroc-runner:
    environment: *marketops-scheduled-boundary
  marketops-eeom-runner:
    environment: *marketops-scheduled-boundary
  massive-puller:
    environment: *marketops-scheduled-boundary
  massive-scheduler:
    environment: *marketops-scheduled-boundary
  marketops-asset-backfill-worker:
    environment: *marketops-scheduled-boundary
  marketops-algorithm-adjudicator:
    environment: *marketops-scheduled-boundary
  marketops-options-feature-materializer:
    environment: *marketops-scheduled-boundary
  algorithm-runner:
    environment: *marketops-scheduled-boundary
  marketops-options-coverage-runner:
    environment: *marketops-scheduled-boundary
  marketops-intelligence-cohort-runner:
    environment: *marketops-scheduled-boundary
  marketops-syncratic-intelligence-runner:
    environment: *marketops-scheduled-boundary
  marketops-sri-runner:
    environment: *marketops-scheduled-boundary
  marketops-sri-holdings-runner:
    environment: *marketops-scheduled-boundary
  marketops-signal-assurance-worker:
    environment: *marketops-scheduled-boundary

  subscriber-global-marketops-parity-manifest:
    profiles: ["subscriber-global-evidence"]
    build:
      context: .
      target: subscriber-global-marketops-parity-manifest
    environment:
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:?inject dedicated MarketOps primary URL}
  subscriber-global-marketops-evidence-materializer:
    profiles: ["subscriber-global-evidence"]
    build:
      context: .
      target: subscriber-global-marketops-evidence-materializer
    environment:
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:?inject dedicated MarketOps primary URL}
  subscriber-global-eod-history-materializer:
    profiles: ["subscriber-global-evidence"]
    build:
      context: .
      target: subscriber-global-eod-history-materializer
    environment:
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:?inject dedicated MarketOps primary URL}
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_TEMPORAL_DATABASE_URL: ${SIGNALOPS_MARKETOPS_TEMPORAL_DATABASE_URL:?inject dedicated MarketOps temporal URL}
  subscriber-global-annual-financial-refresh:
    profiles: ["subscriber-global-evidence"]
    build:
      context: .
      target: subscriber-global-annual-financial-refresh
    environment:
      SIGNALOPS_SUBSCRIBER_GLOBAL_EOD_DATABASE_URL: ${SIGNALOPS_MARKETOPS_DATABASE_URL:?inject dedicated MarketOps primary URL}
      SIGNALOPS_FMP_BASE_URL: ${SIGNALOPS_FMP_BASE_URL:-}
      SIGNALOPS_FMP_API_KEY: ${SIGNALOPS_FMP_API_KEY:-${fmp_apikey:-}}
