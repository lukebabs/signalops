# Dedicated MarketOps pgBackRest overlay. It is applied only by controlled
# recovery commands and mounts the root-owned, short-lived-credential config.
services:
  marketops-postgres:
    build:
      context: .
      dockerfile: deploy/postgres/pgbackrest.Dockerfile
    image: signalops-marketops-postgres-pgbackrest:16
    volumes:
      - ${SIGNALOPS_PGBACKREST_CONFIG_PATH:?set a root-owned pgBackRest configuration}:/etc/pgbackrest/pgbackrest.conf:ro

  marketops-timescaledb:
    build:
      context: .
      dockerfile: deploy/postgres/marketops-timescaledb-pgbackrest.Dockerfile
    image: signalops-marketops-timescaledb-pgbackrest:2.17.2-pg16
    volumes:
      - ${SIGNALOPS_PGBACKREST_CONFIG_PATH:?set a root-owned pgBackRest configuration}:/etc/pgbackrest/pgbackrest.conf:ro
